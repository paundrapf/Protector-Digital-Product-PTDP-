name: Build Windows Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography customtkinter pillow pyinstaller
        
    - name: Verify cryptography installation
      run: |
        python -c "from cryptography.fernet import Fernet; print('Fernet OK')"
        python -c "from cryptography.hazmat.primitives import hashes; print('hashes OK')"
        python -c "from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC; print('PBKDF2HMAC OK')"
    
    - name: Build Viewer
      run: |
        pyinstaller --onefile --noconsole --name=PTDP-Viewer-Windows `
          --hidden-import=cryptography `
          --hidden-import=cryptography.fernet `
          --hidden-import=cryptography.hazmat `
          --hidden-import=cryptography.hazmat.primitives `
          --hidden-import=cryptography.hazmat.primitives.hashes `
          --hidden-import=cryptography.hazmat.primitives.kdf `
          --hidden-import=cryptography.hazmat.primitives.kdf.pbkdf2 `
          --hidden-import=cryptography.hazmat.primitives.ciphers `
          --hidden-import=cryptography.hazmat.primitives.ciphers.aead `
          --hidden-import=cryptography.hazmat.primitives.ciphers.algorithms `
          --hidden-import=cryptography.hazmat.primitives.ciphers.modes `
          --hidden-import=cryptography.hazmat.backends `
          --hidden-import=cryptography.hazmat.backends.openssl `
          --hidden-import=cryptography.hazmat.backends.openssl.backend `
          --hidden-import=cryptography.hazmat.bindings `
          --hidden-import=cryptography.hazmat.bindings.openssl `
          --hidden-import=cryptography.hazmat.bindings._rust `
          --hidden-import=customtkinter `
          --hidden-import=PIL `
          --hidden-import=PIL._tkinter_finder `
          --collect-all=cryptography `
          --collect-all=customtkinter `
          --add-data="gui;gui" `
          --add-data="core;core" `
          --add-data="config.py;." `
          viewer.py
    
    - name: Build Creator
      run: |
        pyinstaller --onefile --noconsole --name=PTDP-Creator-Windows `
          --hidden-import=cryptography `
          --hidden-import=cryptography.fernet `
          --hidden-import=cryptography.hazmat `
          --hidden-import=cryptography.hazmat.primitives `
          --hidden-import=cryptography.hazmat.primitives.hashes `
          --hidden-import=cryptography.hazmat.primitives.kdf `
          --hidden-import=cryptography.hazmat.primitives.kdf.pbkdf2 `
          --hidden-import=cryptography.hazmat.primitives.ciphers `
          --hidden-import=cryptography.hazmat.primitives.ciphers.aead `
          --hidden-import=cryptography.hazmat.primitives.ciphers.algorithms `
          --hidden-import=cryptography.hazmat.primitives.ciphers.modes `
          --hidden-import=cryptography.hazmat.backends `
          --hidden-import=cryptography.hazmat.backends.openssl `
          --hidden-import=cryptography.hazmat.backends.openssl.backend `
          --hidden-import=cryptography.hazmat.bindings `
          --hidden-import=cryptography.hazmat.bindings.openssl `
          --hidden-import=cryptography.hazmat.bindings._rust `
          --hidden-import=customtkinter `
          --hidden-import=PIL `
          --hidden-import=PIL._tkinter_finder `
          --collect-all=cryptography `
          --collect-all=customtkinter `
          --add-data="gui;gui" `
          --add-data="core;core" `
          --add-data="config.py;." `
          creator.py
    
    - name: List output
      run: |
        dir dist
        echo "Viewer size:"
        (Get-Item dist/PTDP-Viewer-Windows.exe).Length / 1MB
        echo "Creator size:"
        (Get-Item dist/PTDP-Creator-Windows.exe).Length / 1MB
    
    - name: Upload Viewer
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Viewer-Windows
        path: dist/PTDP-Viewer-Windows.exe
    
    - name: Upload Creator
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Creator-Windows
        path: dist/PTDP-Creator-Windows.exe
    
    - name: Delete old release
      run: gh release delete latest --yes --cleanup-tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Download PTDP Apps
        body: |
          ## Download & Use Immediately! 🚀
          
          **No installation needed!** Just download, double-click, and use.
          
          ### 👤 For End Users (Read PDFs)
          Download **PTDP-Viewer-Windows.exe** to read protected PDFs
          
          ### 👨‍💼 For Sellers (Protect PDFs)
          Download **PTDP-Creator-Windows.exe** to protect your PDFs
          
          ---
          
          **First time running?** Windows may show a warning. Click "More info" → "Run anyway".
          
          **System Requirements:** Windows 10/11 (64-bit)
        files: |
          dist/PTDP-Viewer-Windows.exe
          dist/PTDP-Creator-Windows.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
