name: Build Windows Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ALL dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography==41.0.7
        pip install requests==2.31.0
        pip install psutil==5.9.6
        pip install customtkinter==5.2.0
        pip install pillow==10.1.0
        pip install pyinstaller==6.3.0
        
    - name: Verify imports
      run: |
        python -c "from cryptography.fernet import Fernet; print('cryptography OK')"
        python -c "import requests; print('requests OK')"
        python -c "import psutil; print('psutil OK')"
        python -c "import customtkinter; print('customtkinter OK')"
        python -c "from PIL import Image; print('PIL OK')"
    
    - name: Build Viewer
      run: |
        pyinstaller --onefile --noconsole --name=PTDP-Viewer-Windows `
          --collect-all=cryptography `
          --collect-all=requests `
          --collect-all=urllib3 `
          --collect-all=certifi `
          --collect-all=charset_normalizer `
          --collect-all=idna `
          --collect-all=psutil `
          --collect-all=customtkinter `
          --collect-all=PIL `
          --hidden-import=cryptography `
          --hidden-import=cryptography.fernet `
          --hidden-import=cryptography.hazmat.primitives `
          --hidden-import=cryptography.hazmat.primitives.hashes `
          --hidden-import=cryptography.hazmat.primitives.kdf.pbkdf2 `
          --hidden-import=cryptography.hazmat.backends `
          --hidden-import=requests `
          --hidden-import=urllib3 `
          --hidden-import=certifi `
          --hidden-import=charset_normalizer `
          --hidden-import=idna `
          --hidden-import=psutil `
          --hidden-import=psutil._pswindows `
          --hidden-import=customtkinter `
          --hidden-import=PIL `
          --hidden-import=PIL._tkinter_finder `
          --hidden-import=PIL.Image `
          --hidden-import=json `
          --hidden-import=hashlib `
          --hidden-import=base64 `
          --hidden-import=uuid `
          --hidden-import=platform `
          --hidden-import=tempfile `
          --hidden-import=datetime `
          --add-data="gui;gui" `
          --add-data="core;core" `
          --add-data="config.py;." `
          viewer.py
    
    - name: Build Creator
      run: |
        pyinstaller --onefile --noconsole --name=PTDP-Creator-Windows `
          --collect-all=cryptography `
          --collect-all=requests `
          --collect-all=urllib3 `
          --collect-all=certifi `
          --collect-all=charset_normalizer `
          --collect-all=idna `
          --collect-all=psutil `
          --collect-all=customtkinter `
          --collect-all=PIL `
          --hidden-import=cryptography `
          --hidden-import=cryptography.fernet `
          --hidden-import=cryptography.hazmat.primitives `
          --hidden-import=cryptography.hazmat.primitives.hashes `
          --hidden-import=cryptography.hazmat.primitives.kdf.pbkdf2 `
          --hidden-import=cryptography.hazmat.backends `
          --hidden-import=requests `
          --hidden-import=urllib3 `
          --hidden-import=certifi `
          --hidden-import=charset_normalizer `
          --hidden-import=idna `
          --hidden-import=psutil `
          --hidden-import=psutil._pswindows `
          --hidden-import=customtkinter `
          --hidden-import=PIL `
          --hidden-import=PIL._tkinter_finder `
          --hidden-import=PIL.Image `
          --hidden-import=json `
          --hidden-import=hashlib `
          --hidden-import=base64 `
          --hidden-import=uuid `
          --hidden-import=platform `
          --hidden-import=tempfile `
          --hidden-import=datetime `
          --add-data="gui;gui" `
          --add-data="core;core" `
          --add-data="config.py;." `
          creator.py
    
    - name: Verify builds
      run: |
        dir dist
        if (Test-Path "dist/PTDP-Viewer-Windows.exe") { Write-Host "Viewer OK" } else { exit 1 }
        if (Test-Path "dist/PTDP-Creator-Windows.exe") { Write-Host "Creator OK" } else { exit 1 }
    
    - name: Upload Viewer
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Viewer-Windows
        path: dist/PTDP-Viewer-Windows.exe
    
    - name: Upload Creator
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Creator-Windows
        path: dist/PTDP-Creator-Windows.exe
    
    - name: Delete old release
      run: gh release delete latest --yes --cleanup-tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Download PTDP Apps
        body: |
          ## Download and Use Immediately!
          
          No installation needed! Just download, double-click, and use.
          
          ### For End Users (Read PDFs)
          Download PTDP-Viewer-Windows.exe to read protected PDFs
          
          ### For Sellers (Protect PDFs)
          Download PTDP-Creator-Windows.exe to protect your PDFs
          
          ---
          
          First time running? Windows may show a warning. Click More info then Run anyway.
          
          System Requirements: Windows 10/11 (64-bit)
        files: |
          dist/PTDP-Viewer-Windows.exe
          dist/PTDP-Creator-Windows.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
