name: Build and Release Windows Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Create simple viewer spec
      run: |
        @"
# -*- mode: python ; coding: utf-8 -*-
block_cipher = None

a = Analysis(
    ['viewer.py'],
    pathex=[],
    binaries=[],
    datas=[],
    hiddenimports=['customtkinter', 'PIL._tkinter_finder', 'cryptography.hazmat.primitives.ciphers', 'cryptography.hazmat.primitives.kdf.pbkdf2', 'cryptography.hazmat.backends'],
    hookspath=[],
    hooksconfig={},
    runtime_hooks=[],
    excludes=[],
    win_no_prefer_redirects=False,
    win_private_assemblies=False,
    cipher=block_cipher,
    noarchive=False,
)

pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

exe = EXE(
    pyz,
    a.scripts,
    a.binaries,
    a.zipfiles,
    a.datas,
    [],
    name='PTDP-Viewer-Windows',
    debug=False,
    bootloader_ignore_signals=False,
    strip=False,
    upx=True,
    upx_exclude=[],
    runtime_tmpdir=None,
    console=False,
    disable_windowed_traceback=False,
    target_arch=None,
    codesign_identity=None,
    entitlements_file=None,
)
"@ | Out-File -FilePath build_viewer_simple.spec -Encoding utf8
      shell: pwsh
    
    - name: Create simple creator spec
      run: |
        @"
# -*- mode: python ; coding: utf-8 -*-
block_cipher = None

a = Analysis(
    ['creator.py'],
    pathex=[],
    binaries=[],
    datas=[],
    hiddenimports=['customtkinter', 'PIL._tkinter_finder', 'cryptography.hazmat.primitives.ciphers', 'cryptography.hazmat.primitives.kdf.pbkdf2', 'cryptography.hazmat.backends'],
    hookspath=[],
    hooksconfig={},
    runtime_hooks=[],
    excludes=[],
    win_no_prefer_redirects=False,
    win_private_assemblies=False,
    cipher=block_cipher,
    noarchive=False,
)

pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

exe = EXE(
    pyz,
    a.scripts,
    a.binaries,
    a.zipfiles,
    a.datas,
    [],
    name='PTDP-Creator-Windows',
    debug=False,
    bootloader_ignore_signals=False,
    strip=False,
    upx=True,
    upx_exclude=[],
    runtime_tmpdir=None,
    console=False,
    disable_windowed_traceback=False,
    target_arch=None,
    codesign_identity=None,
    entitlements_file=None,
)
"@ | Out-File -FilePath build_creator_simple.spec -Encoding utf8
      shell: pwsh
    
    - name: Build PTDP Viewer
      run: |
        pyinstaller --clean --noconfirm build_viewer_simple.spec
    
    - name: Build PTDP Creator
      run: |
        pyinstaller --clean --noconfirm build_creator_simple.spec
    
    - name: List output
      run: |
        dir dist
      shell: pwsh
    
    - name: Upload Viewer
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Viewer-Windows
        path: dist/PTDP-Viewer-Windows.exe
        retention-days: 90
    
    - name: Upload Creator
      uses: actions/upload-artifact@v4
      with:
        name: PTDP-Creator-Windows
        path: dist/PTDP-Creator-Windows.exe
        retention-days: 90
    
    - name: Create/Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Build"
        body: |
          ## 🚀 PTDP - Download & Use Immediately!
          
          ### For End Users (Read Protected PDFs):
          Download **PTDP-Viewer-Windows.exe** → Double-click → Start using!
          
          ### For Sellers (Protect PDFs):
          Download **PTDP-Creator-Windows.exe** → Double-click → Start using!
          
          **No installation needed!** Just download, double-click, and use.
          
          ---
          
          ⚠️ **First time running?** Windows may show "Windows protected your PC"
          - Click "More info" → Click "Run anyway"
          - This is normal for new software!
          
          Built automatically from latest code.
        files: |
          dist/PTDP-Viewer-Windows.exe
          dist/PTDP-Creator-Windows.exe
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
